<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>マイページ - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Zoom Web SDK 3.10.0 -->
    <script src="https://source.zoom.us/3.10.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-embedded-3.10.0.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/zoom-meeting-3.10.0.min.js"></script>

    <style>
        /* PC・スマホ・iPad全対応の可変コンテナ */
        .zoom-wrapper {
            width: 100%;
            height: calc(100dvh - 100px);
            min-height: 400px;
            position: relative;
            overflow: hidden;
        }

        /* Zoom SDKが動的に生成する内部要素の完全全画面化 */
        #meetingSDKElement, 
        #meetingSDKElement > div, 
        #meetingSDKElement iframe,
        .meeting-app,
        #zmmtg-root {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* iPad/タブレット横画面時の最適化 */
        @media (min-width: 768px) and (orientation: landscape) {
            .zoom-wrapper {
                height: calc(100dvh - 80px);
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col overflow-x-hidden">

    <!-- ヘッダー -->
    <header class="bg-slate-800 border-b border-slate-700 p-3 flex justify-between items-center max-w-6xl w-full mx-auto shrink-0">
        <h1 class="font-bold text-base text-indigo-400">🎹 ピアノ練習伴走 Lab</h1>
        <button onclick="handleLogout()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-1.5 px-3 rounded-lg transition">
            ログアウト
        </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-6xl w-full mx-auto p-2 sm:p-4 flex-1 flex flex-col gap-2">

        <!-- ユーザー情報 兼 接続エリア -->
        <div id="controlPanel" class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2 shrink-0">
            <div class="flex justify-between items-center text-xs">
                <span class="text-slate-400 font-bold">ログイン：<span id="userEmail" class="text-slate-200">読み込み中...</span></span>
                <span class="inline-flex items-center gap-1.5 bg-emerald-950 text-emerald-400 text-[10px] px-2.5 py-0.5 rounded-full font-bold border border-emerald-800">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    受講可能
                </span>
            </div>

            <button id="startZoomBtn" onclick="joinZoomRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg shadow-lg transition text-center flex items-center justify-center gap-2 text-sm">
                📹 ルームに入室して練習を始める
            </button>
        </div>

        <!-- Zoom埋め込みコンテナ -->
        <div id="zoomContainer" class="zoom-wrapper rounded-xl overflow-hidden hidden shadow-2xl border border-slate-800">
            <div id="meetingSDKElement"></div>
        </div>

    </main>

    <script>
        // Supabase設定
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Zoom設定
        const MEETING_NUMBER = '6538746410';
        const PASS_WORD = 'U2HNw6';

        let currentUserEmail = '';

        // ユーザー認証チェック
        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                alert('ログインが必要です。');
                window.location.href = 'login.html';
            } else {
                currentUserEmail = user.email;
                document.getElementById('userEmail').innerText = user.email;
            }
        }

        // ログアウト処理
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        // カメラ・マイク事前許可リクエスト（iPad/iOS/Android共通）
        async function requestMediaPermissions() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                stream.getTracks().forEach(track => track.stop());
            } catch (err) {
                console.warn('メディア許可エラー:', err);
            }
        }

        // Zoomルーム接続処理
        async function joinZoomRoom() {
            const client = ZoomMtgEmbedded.createClient();
            const meetingSDKElement = document.getElementById('meetingSDKElement');
            const zoomContainer = document.getElementById('zoomContainer');
            const btn = document.getElementById('startZoomBtn');
            const controlPanel = document.getElementById('controlPanel');

            btn.disabled = true;
            btn.innerText = 'カメラ・マイク準備中...';

            await requestMediaPermissions();

            btn.innerText = '接続準備中...';
            zoomContainer.classList.remove('hidden');

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/generate-zoom-signature`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({
                        meetingNumber: MEETING_NUMBER,
                        role: 0
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.signature) {
                    throw new Error(data.error || '署名の取得に失敗しました');
                }

                btn.innerText = 'Zoom初期化中...';

                await client.init({
                    zoomAppRoot: meetingSDKElement,
                    language: 'ja-JP'
                });

                btn.innerText = '接続中...';

                await client.join({
                    sdkKey: data.sdkKey,
                    signature: data.signature,
                    meetingNumber: MEETING_NUMBER,
                    password: PASS_WORD,
                    userName: '受講生',
                    userEmail: currentUserEmail
                });

                // 接続成功後は上のボタンパネルを隠して大画面化
                controlPanel.classList.add('hidden');

            } catch (error) {
                alert('Zoom接続エラー: ' + error.message);
                btn.disabled = false;
                btn.innerText = '📹 ルームに入室して練習を始める';
            }
        }

        checkUser();
    </script>
</body>
</html>

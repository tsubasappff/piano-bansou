<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fcfbf9;
            color: #4a423d;
        }
        .french-title {
            font-family: 'Marcellus', serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-amber-50/60 via-stone-50 to-amber-100/30 p-4 sm:p-6">

    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- ヘッダー -->
        <div class="flex items-center justify-between bg-white/80 backdrop-blur-sm p-4 sm:p-5 rounded-2xl border border-stone-200/80 shadow-sm">
            <div class="flex items-center gap-2">
                <span class="text-xl">🎹</span>
                <span class="font-normal text-stone-800 french-title text-base sm:text-lg">ピアノ練習伴走 Lab</span>
            </div>
            <button onclick="handleLogout()" class="text-xs text-stone-500 hover:text-stone-800 transition px-3 py-1.5 rounded-lg border border-stone-200 hover:bg-stone-50">
                ログアウト
            </button>
        </div>

        <!-- ウェルカムカード -->
        <div class="bg-white/90 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-stone-200/80 shadow-xl shadow-stone-200/50 space-y-6">
            
            <div class="space-y-1">
                <div class="text-xs font-medium text-amber-800/80 tracking-wider">MEMBER'S SALON</div>
                <h1 class="text-xl sm:text-2xl font-bold text-stone-800">おかえりなさいませ</h1>
                <p id="userEmail" class="text-xs text-stone-400">読み込み中...</p>
            </div>

            <!-- メインアクション：レッスンルーム入室 -->
            <div class="bg-gradient-to-br from-amber-50 to-stone-50 p-6 rounded-2xl border border-amber-200/70 space-y-4 text-center">
                <div class="inline-block px-3 py-1 bg-white text-amber-900 rounded-full text-xs font-bold shadow-sm">
                    ☕️ 本日のレッスン
                </div>
                <div>
                    <h2 class="text-lg font-bold text-stone-800">オンラインサロンルーム</h2>
                    <p class="text-xs text-stone-500 mt-1">時間になりましたら下のボタンを押してご入室ください</p>
                </div>
                
                <a href="https://meet.google.com" target="_blank" rel="noopener noreferrer" 
                    class="inline-flex items-center justify-center gap-2 w-full bg-stone-800 hover:bg-stone-700 text-amber-50 font-medium py-4 rounded-xl transition shadow-md text-sm">
                    <span>サロン（レッスンルーム）に入る</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </a>
            </div>

            <!-- ガイドカード -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                <div class="p-4 rounded-xl bg-stone-50/80 border border-stone-200/60 space-y-1">
                    <div class="text-xs font-bold text-stone-700 flex items-center gap-1">
                        📋 ご利用のながれ
                    </div>
                    <p class="text-[11px] text-stone-500 leading-relaxed">
                        レッスン時間前になりましたら楽譜と鍵盤の準備をしてお待ちください。
                    </p>
                </div>
                <div class="p-4 rounded-xl bg-stone-50/80 border border-stone-200/60 space-y-1">
                    <div class="text-xs font-bold text-stone-700 flex items-center gap-1">
                        💬 サポート・お問い合わせ
                    </div>
                    <p class="text-[11px] text-stone-500 leading-relaxed">
                        ご不明点や接続トラブルがございましたら、いつでも公式LINEまでご連絡ください。
                    </p>
                </div>
            </div>

        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('userEmail').innerText = session.user.email;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        checkUser();
    </script>
</body>
</html>

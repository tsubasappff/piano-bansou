<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Zoom Web SDK 3.10.0 -->
    <script src="https://source.zoom.us/3.10.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-embedded-3.10.0.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/zoom-meeting-3.10.0.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 flex justify-between items-center max-w-4xl mx-auto">
        <h1 class="font-bold text-lg text-indigo-600">🎹 ピアノ練習伴走 Lab</h1>
        <button onclick="handleLogout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2 px-3 rounded-lg transition">
            ログアウト
        </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-xl mx-auto p-4 space-y-6">

        <!-- ユーザー情報カード -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">ログイン中のユーザー</p>
            <p id="userEmail" class="font-bold text-slate-800 text-base break-all">読み込み中...</p>
            <div class="mt-3 inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 text-xs px-3 py-1 rounded-full font-bold">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                受講可能ステータス
            </div>
        </div>

        <!-- Zoom接続エリア -->
        <div class="bg-indigo-600 text-white p-6 rounded-2xl shadow-lg space-y-4">
            <h2 class="text-xl font-bold">オンライン練習伴走ルーム</h2>
            <p class="text-xs text-indigo-100 leading-relaxed">
                下の「ルームに入室する」ボタンを押すと、この画面のままZoomミーティングに接続します。（カメラ・マイクの許可ダイアログが出た場合は許可してください）
            </p>

            <button id="startZoomBtn" onclick="joinZoomRoom()" class="w-full bg-white text-indigo-600 font-bold py-4 rounded-xl shadow hover:bg-indigo-50 transition text-center flex items-center justify-center gap-2 text-base">
                📹 ルームに入室して接続する
            </button>
        </div>

        <!-- Zoom埋め込みコンテナ -->
        <div id="meetingSDKElement" class="w-full h-[600px] bg-black rounded-2xl overflow-hidden hidden shadow-xl border border-slate-300"></div>

    </main>

    <script>
        // Supabase設定
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Zoom設定
        const MEETING_NUMBER = '6538746410';
        const PASS_WORD = 'U2HNw6';

        let currentUserEmail = '';

        // ユーザー認証チェック
        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                alert('ログインが必要です。');
                window.location.href = 'login.html';
            } else {
                currentUserEmail = user.email;
                document.getElementById('userEmail').innerText = user.email;
            }
        }

        // ログアウト処理
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        // Zoomルーム接続処理（Edge Function経由で安全に署名を取得）
        async function joinZoomRoom() {
            const client = ZoomMtgEmbedded.createClient();
            const meetingSDKElement = document.getElementById('meetingSDKElement');
            const btn = document.getElementById('startZoomBtn');

            btn.disabled = true;
            btn.innerText = '署名を取得中...';
            meetingSDKElement.classList.remove('hidden');

            try {
                // Supabase Edge Function から署名を取得
                const response = await fetch(`${SUPABASE_URL}/functions/v1/generate-zoom-signature`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({
                        meetingNumber: MEETING_NUMBER,
                        role: 0
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.signature) {
                    throw new Error(data.error || '署名の取得に失敗しました');
                }

                btn.innerText = 'Zoom初期化中...';

                await client.init({
                    zoomAppRoot: meetingSDKElement,
                    language: 'ja-JP'
                });

                btn.innerText = '接続中...';

                await client.join({
                    sdkKey: data.sdkKey,
                    signature: data.signature,
                    meetingNumber: MEETING_NUMBER,
                    password: PASS_WORD,
                    userName: currentUserEmail || '受講者',
                    userEmail: currentUserEmail
                });

                btn.innerText = '接続完了';
            } catch (error) {
                alert('Zoom接続エラー: ' + error.message);
                btn.disabled = false;
                btn.innerText = '📹 ルームに入室して接続する';
            }
        }

        checkUser();
    </script>
</body>
</html>

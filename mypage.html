<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 flex justify-between items-center max-w-4xl mx-auto">
        <h1 class="font-bold text-lg text-indigo-600">🎹 ピアノ練習伴走 Lab</h1>
        <button onclick="handleLogout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2 px-3 rounded-lg transition">
            ログアウト
        </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- ユーザー情報カード -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">ログイン中のユーザー</p>
            <p id="userEmail" class="font-bold text-slate-800 text-base break-all">読み込み中...</p>
            <div class="mt-3 inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 text-xs px-3 py-1 rounded-full font-bold">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                受講可能ステータス
            </div>
        </div>

        <!-- Zoom接続アクションエリア -->
        <div class="bg-indigo-600 text-white p-6 rounded-2xl shadow-lg space-y-4">
            <h2 class="text-xl font-bold">オンラインルーム</h2>
            <p class="text-xs text-indigo-100 leading-relaxed">
                時間になりましたら下のボタンを押して、練習伴走ミーティングルームに入室してください。
            </p>

            <button id="startZoomBtn" onclick="joinZoomRoom()" class="w-full bg-white text-indigo-600 font-bold py-4 rounded-xl shadow hover:bg-indigo-50 transition text-center flex items-center justify-center gap-2 text-base">
                📹 ルームに入室して接続する
            </button>
        </div>

        <!-- 通話画面表示領域（Zoom起動時に使用） -->
        <div id="zmmtg-root" class="hidden w-full h-[500px] rounded-2xl overflow-hidden shadow-lg border border-slate-300"></div>

    </main>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ページ読み込み時にログイン状態をチェック
        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                // ログインしていなければログイン画面に弾く
                alert('ログインが必要です。');
                window.location.href = 'login.html';
            } else {
                // ログインしているメールアドレスを表示
                document.getElementById('userEmail').innerText = user.email;
            }
        }

        // ログアウト処理
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        // Zoom室への接続テスト処理
        function joinZoomRoom() {
            alert('Zoom SDK連携モジュールの起動テストです。次はZoom API Keyを使用した自動接続ロジックを組み込みます！');
        }

        checkUser();
    </script>
</body>
</html>

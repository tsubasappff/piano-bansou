<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-lg">ピアノ練習伴走 Lab</h1>
        <button onclick="handleLogout()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-400">
            ログアウト
        </button>
    </header>

    <main id="mainContent" class="max-w-lg mx-auto p-4 mt-6 hidden">

        <!-- マイページダッシュボード -->
        <div class="space-y-4">
            
            <!-- ユーザー情報カード -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500">ログイン中のアカウント</p>
                <p id="userEmail" class="font-bold text-slate-800 mt-0.5 text-sm"></p>
            </div>

            <!-- 練習ルーム起動カード -->
            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white p-6 rounded-2xl shadow-lg">
                <span class="bg-white/20 text-xs px-2.5 py-1 rounded-full font-semibold">アプリ・ログイン不要</span>
                <h3 class="text-xl font-bold mt-2">練習ルームに入室する</h3>
                <p class="text-xs opacity-90 mt-1">タップするだけでブラウザ上でZoom接続が始まります。</p>
                
                <button onclick="joinZoomRoom()" class="mt-5 w-full bg-white text-indigo-700 font-extrabold py-3.5 rounded-xl shadow hover:bg-slate-100 transition text-center block">
                    📹 ルームを起動して接続する
                </button>
            </div>

            <!-- 予約・ステータス -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h4 class="font-bold text-sm text-slate-700 border-b pb-2">本日の伴走ステータス</h4>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-500">現在の稼働体制</span>
                    <span class="font-semibold text-emerald-600">● 講師待機中（すぐ入れます）</span>
                </div>
            </div>

        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://flzguqgdltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY'; // ※ご自身のanon keyに置き換えてください
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ログインチェックと画面保護
        async function checkAuthAndLoad() {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (!user) {
                // 未ログインの場合はログイン画面へ弾く
                window.location.href = 'login.html';
            } else {
                // ログイン済みなら画面を表示
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('mainContent').classList.remove('hidden');
            }
        }

        // ログアウト処理
        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        // Zoom接続テスト
        function joinZoomRoom() {
            alert('Zoom Web SDK接続を準備中...（次のステップで組み込みます）');
        }

        // ページ読み込み時に実行
        checkAuthAndLoad();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>マイページ - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://source.zoom.us/3.10.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-embedded-3.10.0.min.js"></script>
    <script src="https://source.zoom.us/3.10.0/zoom-meeting-3.10.0.min.js"></script>

    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            background-color: #1a1615;
            color: #f3efe6;
        }
        .serif-title {
            font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
        }

        .zoom-wrapper {
            width: 100%;
            height: calc(100dvh - 110px);
            min-height: 400px;
            position: relative;
            overflow: hidden;
        }

        #meetingSDKElement, 
        #meetingSDKElement > div, 
        #meetingSDKElement iframe,
        .meeting-app,
        #zmmtg-root {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        @media (min-width: 768px) and (orientation: landscape) {
            .zoom-wrapper {
                height: calc(100dvh - 90px);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden bg-stone-950">

    <header class="bg-stone-900/90 border-b border-amber-900/30 p-3 flex justify-between items-center max-w-6xl w-full mx-auto shrink-0 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <h1 class="font-semibold text-base text-amber-200 serif-title tracking-wide">🎹 ピアノ練習伴走 Lab</h1>
        </div>
        <button onclick="handleLogout()" class="text-xs bg-stone-800 hover:bg-stone-700 text-stone-300 font-medium py-1.5 px-3 rounded-lg border border-stone-700/60 transition">
            ログアウト
        </button>
    </header>

    <main class="max-w-6xl w-full mx-auto p-2 sm:p-4 flex-1 flex flex-col gap-3">

        <div id="controlPanel" class="bg-stone-900/80 p-4 rounded-2xl border border-amber-900/30 space-y-3 shrink-0 shadow-xl">
            <div class="flex justify-between items-center text-xs">
                <span class="text-stone-400">会員様: <span id="userEmail" class="text-amber-100 font-medium">読み込み中...</span></span>
                <span class="inline-flex items-center gap-1.5 bg-emerald-950/80 text-emerald-300 text-[10px] px-2.5 py-0.5 rounded-full font-medium border border-emerald-800/60">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    レッスン受付中
                </span>
            </div>

            <button id="startZoomBtn" onclick="joinZoomRoom()" class="w-full bg-gradient-to-r from-amber-700 to-amber-800 hover:from-amber-600 hover:to-amber-700 text-amber-50 font-medium py-3.5 rounded-xl shadow-lg transition text-center flex items-center justify-center gap-2 text-sm border border-amber-600/30">
                ☕️ オンラインサロンに入室して練習を始める
            </button>
        </div>

        <div id="zoomContainer" class="zoom-wrapper rounded-2xl overflow-hidden hidden shadow-2xl border border-amber-900/40">
            <div id="meetingSDKElement"></div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const MEETING_NUMBER = '6538746410';
        const PASS_WORD = 'U2HNw6';

        let currentUserEmail = '';

        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                alert('ログインが必要です。');
                window.location.href = 'login.html';
            } else {
                currentUserEmail = user.email;
                document.getElementById('userEmail').innerText = user.email;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        async function requestMediaPermissions() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                stream.getTracks().forEach(track => track.stop());
            } catch (err) {
                console.warn('メディア許可エラー:', err);
            }
        }

        async function joinZoomRoom() {
            const client = ZoomMtgEmbedded.createClient();
            const meetingSDKElement = document.getElementById('meetingSDKElement');
            const zoomContainer = document.getElementById('zoomContainer');
            const btn = document.getElementById('startZoomBtn');
            const controlPanel = document.getElementById('controlPanel');

            btn.disabled = true;
            btn.innerText = 'カメラ・マイクの接続準備中...';

            await requestMediaPermissions();

            btn.innerText = 'レッスンルームへ接続中...';
            zoomContainer.classList.remove('hidden');

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/generate-zoom-signature`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({
                        meetingNumber: MEETING_NUMBER,
                        role: 0
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.signature) {
                    throw new Error(data.error || '署名の取得に失敗しました');
                }

                btn.innerText = 'Zoom初期化中...';

                await client.init({
                    zoomAppRoot: meetingSDKElement,
                    language: 'ja-JP'
                });

                btn.innerText = '接続完了';

                await client.join({
                    sdkKey: data.sdkKey,
                    signature: data.signature,
                    meetingNumber: MEETING_NUMBER,
                    password: PASS_WORD,
                    userName: '受講生',
                    userEmail: currentUserEmail
                });

                controlPanel.classList.add('hidden');

            } catch (error) {
                alert('Zoom接続エラー: ' + error.message);
                btn.disabled = false;
                btn.innerText = '☕️ オンラインサロンに入室して練習を始める';
            }
        }

        checkUser();
    </script>
</body>
</html>

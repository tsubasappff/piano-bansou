<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しいパスワードの設定 - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-200">
        <h2 class="text-xl font-bold text-center text-slate-900 mb-2">新しいパスワードの設定</h2>
        <p class="text-xs text-slate-500 text-center mb-6">新しいパスワードを入力してください。</p>

        <form id="updateForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">新しいパスワード（6文字以上）</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="••••••••" class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">
                パスワードを変更してログイン
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = '更新中...';

            // パスワードを更新
            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                alert('更新エラー: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'パスワードを変更してログイン';
            } else {
                alert('パスワードを変更しました！マイページへ移動します。');
                window.location.href = 'mypage.html';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fcfbf9;
            color: #4a423d;
        }
        .serif-title {
            font-family: 'Marcellus', serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 bg-gradient-to-b from-amber-50/60 via-stone-50 to-amber-100/30">

    <!-- ヘッダー -->
    <header class="max-w-md w-full mx-auto flex items-center justify-between py-2">
        <span class="text-xs font-bold tracking-wider text-stone-500 uppercase serif-title">PIANO LAB</span>
        <a href="login.html" class="text-xs font-medium text-stone-600 hover:text-amber-900 border border-stone-200/80 rounded-full px-3.5 py-1.5 bg-white/80 shadow-sm transition">
            ログイン
        </a>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md w-full mx-auto bg-white/90 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-stone-200/80 shadow-xl shadow-stone-200/50 space-y-6 my-auto">
        
        <div class="space-y-3 text-center">
            <div class="inline-block px-3.5 py-1 bg-amber-100/70 text-amber-900/80 rounded-full text-[11px] font-medium tracking-wider mb-1">
                WELCOME
            </div>
            <h1 class="text-2xl sm:text-3xl font-normal text-stone-800 leading-tight">
                毎日のピアノ練習を、<br>もっと無理なく習慣に。
            </h1>
            <p class="text-stone-500 text-xs leading-relaxed pt-1">
                「練習しなさい」と言わなくても自発的に向かえるように。<br>お子さまの練習記録と声かけをサポートする伴走ツールです。
            </p>
        </div>

        <div class="space-y-3 pt-2">
            <a href="signup.html" class="block w-full text-center bg-stone-800 hover:bg-stone-700 text-amber-50 font-medium py-3.5 rounded-xl transition shadow-md text-sm">
                新規アカウント登録
            </a>
            <a href="login.html" class="block w-full text-center bg-amber-50/80 hover:bg-amber-100/80 text-amber-900 font-medium py-3 rounded-xl transition text-sm border border-amber-200/60">
                ログインはこちら
            </a>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center py-4 text-xs text-stone-400">
        &copy; ピアノ練習伴走 Lab
    </footer>

</body>
</html>

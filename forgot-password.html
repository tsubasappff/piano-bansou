<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再発行 - ピアノ練習伴走 Lab</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fcfbf9;
            color: #4a423d;
        }

        .serif-title {
            font-family: 'Marcellus', serif;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-amber-50/60 via-stone-50 to-amber-100/30">

    <div class="max-w-md w-full bg-white/90 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-stone-200/80 shadow-xl shadow-stone-200/50 space-y-6">

        <div>
            <a href="login.html"
               class="inline-flex items-center gap-1.5 text-xs text-stone-500 hover:text-stone-800 transition font-medium py-1 px-2.5 rounded-full hover:bg-stone-100">

                ← ログイン画面に戻る

            </a>
        </div>

        <div class="text-center space-y-2">

            <div class="inline-block px-3.5 py-1 bg-amber-100/70 text-amber-900/80 rounded-full text-[11px] font-medium tracking-wider mb-1">
                PASSWORD RESET
            </div>

            <h1 class="text-2xl sm:text-3xl font-normal text-stone-800 tracking-wide">
                パスワード再発行
            </h1>

            <p class="text-stone-500 text-xs leading-relaxed">
                登録済みのメールアドレスを入力してください。<br>
                パスワード再設定用のメールをお送りします。
            </p>

        </div>

        <form id="resetForm" onsubmit="handleReset(event)" class="space-y-4">

            <div class="space-y-1.5">

                <label for="email"
                       class="block text-xs font-bold text-stone-600">
                    メールアドレス
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="example@email.com"
                    class="w-full bg-stone-50/80 border border-stone-200 rounded-xl px-4 py-3 text-stone-800 text-sm focus:outline-none focus:border-amber-400 focus:bg-white transition placeholder:text-stone-300"
                >

            </div>

            <button
                type="submit"
                id="submitBtn"
                class="w-full bg-stone-800 hover:bg-stone-700 text-amber-50 font-medium py-3.5 rounded-xl transition shadow-md text-sm"
            >
                再設定メールを送る
            </button>

        </form>

        <div
            id="message"
            class="hidden text-center text-sm leading-relaxed rounded-xl p-4"
        ></div>

    </div>


    <script>

        const SUPABASE_URL =
            'https://flzguqgdgltwzuxudolg.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_OLBwcfhlNWH138L_olLRgw_je0YDJqn';

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function handleReset(event) {

            event.preventDefault();

            const email =
                document.getElementById('email').value.trim();

            const submitBtn =
                document.getElementById('submitBtn');

            const message =
                document.getElementById('message');


            submitBtn.disabled = true;
            submitBtn.innerText = '送信中...';

            message.classList.add('hidden');


            try {

                const { error } =
                    await supabaseClient.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin +
                                '/reset-password.html'
                        }
                    );


                if (error) {

                    message.textContent =
                        'メールの送信に失敗しました。もう一度お試しください。';

                    message.className =
                        'text-center text-sm leading-relaxed rounded-xl p-4 bg-red-50 text-red-700';

                    submitBtn.disabled = false;
                    submitBtn.innerText = '再設定メールを送る';

                    return;
                }


                message.textContent =
                    'パスワード再設定用のメールを送信しました。メールをご確認ください。';

                message.className =
                    'text-center text-sm leading-relaxed rounded-xl p-4 bg-green-50 text-green-700';

                submitBtn.innerText = '送信しました';


            } catch (err) {

                message.textContent =
                    'システムエラーが発生しました。もう一度お試しください。';

                message.className =
                    'text-center text-sm leading-relaxed rounded-xl p-4 bg-red-50 text-red-700';

                submitBtn.disabled = false;
                submitBtn.innerText = '再設定メールを送る';

            }

        }

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fcfbf9;
            color: #4a423d;
        }
        .french-title {
            font-family: 'Marcellus', serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-amber-50/60 via-stone-50 to-amber-100/30">

    <div class="max-w-md w-full bg-white/90 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-stone-200/80 shadow-xl shadow-stone-200/50 space-y-6 relative">
        
        <!-- ログインへ戻るボタン -->
        <div class="flex items-center justify-start">
            <a href="login.html" class="inline-flex items-center gap-1.5 text-xs text-stone-500 hover:text-amber-800 transition font-medium py-1 px-2.5 rounded-full hover:bg-amber-50/80">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                ログイン画面に戻る
            </a>
        </div>

        <!-- ヘッダーエリア -->
        <div class="text-center space-y-2">
            <div class="inline-block px-3.5 py-1 bg-amber-100/70 text-amber-900/80 rounded-full text-[11px] font-medium tracking-wider mb-1">
                PASSWORD RESET
            </div>
            <h1 class="text-2xl sm:text-3xl font-normal text-stone-800 french-title tracking-wide">
                パスワードの再設定
            </h1>
            <p class="text-stone-500 text-xs leading-relaxed">
                ご登録のメールアドレスを入力してください。<br>再設定用リンクをお送りします。
            </p>
        </div>

        <!-- 送信フォーム -->
        <form id="resetForm" onsubmit="handleResetRequest(event)" class="space-y-4">
            <div class="space-y-1.5">
                <label for="email" class="block text-xs font-bold text-stone-600">メールアドレス</label>
                <input type="email" id="email" required placeholder="example@email.com"
                    class="w-full bg-stone-50/80 border border-stone-200 rounded-xl px-4 py-3 text-stone-800 text-sm focus:outline-none focus:border-amber-400 focus:bg-white transition placeholder:text-stone-300">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-stone-800 hover:bg-stone-700 text-amber-50 font-medium py-3.5 rounded-xl transition shadow-md text-sm flex items-center justify-center gap-2">
                再設定メールを送信する
            </button>
        </form>

    </div>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleResetRequest(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = '送信中...';

                // update-password.html へリダイレクトするように設定
                const redirectUrl = `${window.location.origin}/update-password.html`;

                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: redirectUrl,
                });

                if (error) {
                    alert('エラーが発生しました: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = '再設定メールを送信する';
                } else {
                    alert('パスワード再設定メールを送信しました。メールボックスをご確認ください。');
                    window.location.href = 'login.html';
                }
            } catch (err) {
                alert('システムエラーが発生しました: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = '再設定メールを送信する';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-200">
        <h2 class="text-xl font-bold text-center text-slate-900 mb-2">パスワードをお忘れの方</h2>
        <p class="text-xs text-slate-500 text-center mb-6">ご登録のメールアドレスを入力してください。再設定用のリンクをお送りします。</p>

        <form id="resetForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">メールアドレス</label>
                <input type="email" id="email" required placeholder="example@email.com" class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">
                再設定メールを送信する
            </button>
        </form>

        <p class="text-xs text-center text-slate-500 mt-6">
            <a href="login.html" class="text-indigo-600 font-bold hover:underline">ログイン画面に戻る</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = '送信中...';

            // パスワード再設定メールを送信
            const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://piano-bansou.pages.dev/update-password.html', // メール内のリンクを踏んだ後の遷移先
            });

            if (error) {
                alert('エラー: ' + error.message);
                btn.disabled = false;
                btn.innerText = '再設定メールを送信する';
            } else {
                alert('パスワード再設定用のメールを送信しました。メール内のリンクから新しいパスワードを設定してください。');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>先生用 | PIANO BANSOU</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@daily-co/daily-js"></script>

    <style>
        body {
            font-family: sans-serif;
            background: #1c1917;
            color: #f5f5f4;
        }

        #video-container {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
        }
    </style>
</head>

<body class="min-h-screen">

    <div id="video-container"></div>

    <div id="main-ui">

        <header class="p-4 bg-stone-900 border-b border-stone-800">
            <div class="max-w-md mx-auto flex justify-between items-center">

                <div class="font-bold">
                    🎹 PIANO BANSOU
                </div>

                <a
                    href="mypage.html"
                    class="text-xs text-stone-400 border border-stone-700 px-3 py-2 rounded-lg"
                >
                    戻る
                </a>

            </div>
        </header>


        <main class="max-w-md mx-auto p-5">

            <div class="mt-8 bg-stone-800 rounded-3xl p-7">

                <div class="text-center">

                    <div class="text-5xl">
                        🎹
                    </div>

                    <h1 class="mt-5 text-2xl font-bold">
                        先生用
                    </h1>

                    <p class="mt-3 text-sm text-stone-400 leading-6">
                        練習を開始すると、<br>
                        お子さまが入室できるようになります。
                    </p>

                </div>


                <div
                    id="status"
                    class="mt-7 bg-stone-900 border border-stone-700 rounded-2xl p-5 text-center"
                >
                    <p class="text-sm text-stone-400">
                        練習を開始できます
                    </p>
                </div>


                <button
                    id="start-button"
                    onclick="startPractice()"
                    class="mt-6 w-full bg-amber-500 text-stone-950 font-bold py-4 rounded-2xl active:scale-95"
                >
                    🎹 練習を開始する
                </button>


                <button
                    id="end-button"
                    onclick="endPractice()"
                    class="hidden mt-4 w-full bg-stone-700 text-white font-bold py-4 rounded-2xl"
                >
                    練習を終了する
                </button>

            </div>

        </main>

    </div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    'https://flzguqgdgltwzuxudolg.supabase.co';


/*
 * ここだけ現在の tutor.html からコピー
 *
 * 今のファイルにある
 *
 * const SUPABASE_KEY = '...';
 *
 * の「...」の部分をそのまま入れてください。
 */

const SUPABASE_KEY = 
    'sb_publishable_OLBwcfhlNWH138L_olLRgw_je0YDJqn';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   STATE
========================================= */

let currentUser = null;
let currentSession = null;
let callFrame = null;


/* =========================================
   LOGIN
========================================= */

async function loadUser() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'login.html';

        return false;
    }


    currentUser =
        session.user;

    return true;
}


/* =========================================
   START PRACTICE
========================================= */

async function startPractice() {

    if (!currentUser) {
        return;
    }


    const button =
        document.getElementById(
            'start-button'
        );

    const status =
        document.getElementById(
            'status'
        );


    button.disabled = true;

    button.innerText =
        '準備しています…';


    try {

        /*
         * Supabase Edge Functionを呼び出す
         *
         * DailyのAPIキーはブラウザには存在しません。
         */

        const {
            data,
            error
        } =
            await supabaseClient.functions.invoke(
                'create-daily-room',
                {
                    body: {}
                }
            );


        if (error) {
            throw error;
        }


        if (!data || !data.success) {

            throw new Error(
                data?.error ||
                'Dailyルームの作成に失敗しました'
            );

        }


        /*
         * 練習セッションを作成
         *
         * 現段階はテスト用。
         */

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabaseClient
                .from('practice_sessions')
                .insert({

                    child_id:
                        currentUser.id,

                    tutor_id:
                        currentUser.id,

                    status:
                        'active',

                    room_name:
                        data.room_name,

                    started_at:
                        new Date().toISOString()

                })
                .select()
                .single();


        if (sessionError) {
            throw sessionError;
        }


        currentSession =
            sessionData;


        status.innerHTML = `
            <p class="text-green-400 font-bold">
                ● 練習中
            </p>

            <p class="mt-2 text-xs text-stone-500">
                お子さまが入室できます
            </p>
        `;


        button.classList.add(
            'hidden'
        );


        document
            .getElementById(
                'end-button'
            )
            .classList.remove(
                'hidden'
            );


        /*
         * Dailyへ入室
         */

        await joinDaily(
            data.room_url,
            data.token
        );


    } catch (error) {

        console.error(error);


        status.innerHTML = `
            <p class="text-red-400 font-bold">
                エラーが発生しました
            </p>

            <p class="mt-2 text-xs text-stone-500">
                ${escapeHtml(
                    error.message ||
                    'Unknown error'
                )}
            </p>
        `;


        button.disabled =
            false;

        button.innerText =
            '🎹 練習を開始する';
    }
}


/* =========================================
   DAILY
========================================= */

async function joinDaily(
    roomUrl,
    token
) {

    const container =
        document.getElementById(
            'video-container'
        );


    container.style.display =
        'block';


    document.getElementById(
        'main-ui'
    ).style.display =
        'none';


    callFrame =
        DailyIframe.createFrame(
            container,
            {

                showLeaveButton:
                    true,

                iframeStyle: {

                    width:
                        '100%',

                    height:
                        '100%',

                    border:
                        '0'
                }

            }
        );


    callFrame.on(
        'left-meeting',
        () => {

            container.style.display =
                'none';

            container.innerHTML =
                '';

            document.getElementById(
                'main-ui'
            ).style.display =
                'block';

        }
    );


    await callFrame.join({

        url:
            roomUrl,

        token:
            token,

        userName:
            '音大生サポーター'

    });
}


/* =========================================
   END
========================================= */

async function endPractice() {

    if (!currentSession) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from('practice_sessions')
            .update({

                status:
                    'ended',

                ended_at:
                    new Date().toISOString()

            })
            .eq(
                'id',
                currentSession.id
            );


    if (error) {

        alert(
            '終了処理に失敗しました'
        );

        return;
    }


    if (callFrame) {

        try {
            await callFrame.leave();
        } catch (e) {
            console.warn(e);
        }


        try {
            callFrame.destroy();
        } catch (e) {
            console.warn(e);
        }


        callFrame =
            null;
    }


    document.getElementById(
        'video-container'
    ).style.display =
        'none';


    document.getElementById(
        'video-container'
    ).innerHTML =
        '';


    document.getElementById(
        'main-ui'
    ).style.display =
        'block';


    document.getElementById(
        'status'
    ).innerHTML = `
        <p class="text-stone-400 font-bold">
            練習終了
        </p>
    `;


    document.getElementById(
        'end-button'
    ).classList.add(
        'hidden'
    );


    document.getElementById(
        'start-button'
    ).classList.remove(
        'hidden'
    );


    document.getElementById(
        'start-button'
    ).disabled =
        false;


    document.getElementById(
        'start-button'
    ).innerText =
        '🎹 練習を開始する';


    currentSession =
        null;
}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            '&',
            '&amp;'
        )

        .replaceAll(
            '<',
            '&lt;'
        )

        .replaceAll(
            '>',
            '&gt;'
        )

        .replaceAll(
            '"',
            '&quot;'
        )

        .replaceAll(
            "'",
            '&#039;'
        );
}


/* =========================================
   START
========================================= */

async function start() {

    const loggedIn =
        await loadUser();


    if (!loggedIn) {
        return;
    }

}


start();

</script>

</body>
</html>

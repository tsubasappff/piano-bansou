<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンラインレッスン室 - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Jitsi Meet API -->
    <script src="https://meet.jit.si/external_api.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #1c1917;
            color: #f5f5f4;
        }
        .serif-title {
            font-family: 'Marcellus', serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- ヘッダー -->
    <header class="flex items-center justify-between p-4 bg-stone-900/90 backdrop-blur-sm border-b border-stone-800">
        <div class="flex items-center gap-2">
            <span class="text-xl">🎹</span>
            <span class="font-medium text-amber-100 serif-title text-sm sm:text-base">オンラインレッスン室</span>
        </div>
        <a href="mypage.html" class="text-xs text-stone-400 hover:text-white px-3 py-1.5 rounded-lg border border-stone-700 hover:bg-stone-800 transition">
            マイページへ戻る
        </a>
    </header>

    <!-- 通話画面エリア -->
    <main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 relative">
        <div id="loading" class="text-stone-400 text-sm mb-4">レッスン室を準備中...</div>
        <div id="meet-container" class="w-full max-w-5xl h-[75vh] bg-stone-900 rounded-2xl overflow-hidden border border-stone-800 shadow-2xl"></div>
    </main>

    <!-- フッター -->
    <footer class="text-center py-3 text-xs text-stone-500 border-t border-stone-900">
        &copy; ピアノ練習伴走 Lab
    </footer>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initLessonRoom() {
            try {
                // セッション情報の取得を正しく待機
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error || !session) {
                    console.log("未ログイン状態のためログインページへ遷移します");
                    window.location.href = 'login.html';
                    return;
                }

                // ローディングメッセージを非表示化
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.style.display = 'none';

                // ユーザー固有の表示名（メールアドレスの@前）
                const displayName = session.user.email ? session.user.email.split('@')[0] : 'ゲスト';

                // Jitsi 通話画面の初期化
                const domain = 'meet.jit.si';
                const options = {
                    roomName: 'PianoLab_LessonRoom_Protected_12345',
                    width: '100%',
                    height: '100%',
                    parentNode: document.querySelector('#meet-container'),
                    userInfo: {
                        displayName: displayName
                    },
                    configOverwrite: {
                        startWithAudioMuted: false,
                        startWithVideoMuted: false,
                        disableDeepLinking: true,
                        prejoinPageEnabled: false
                    },
                    interfaceConfigOverwrite: {
                        SHOW_JITSI_WATERMARK: false,
                        TOOLBAR_BUTTONS: [
                            'microphone', 'camera', 'desktop', 'fullscreen',
                            'fading-header', 'hangup', 'chat', 'tileview'
                        ]
                    }
                };

                const api = new JitsiMeetExternalAPI(domain, options);

            } catch (err) {
                console.error("エラーが発生しました:", err);
            }
        }

        // ページ読み込み完了後に実行
        window.addEventListener('DOMContentLoaded', () => {
            initLessonRoom();
        });
    </script>
</body>
</html>

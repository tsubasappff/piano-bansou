<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>一緒に練習 | PIANO BANSOU</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://meet.jit.si/external_api.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: #1c1917;
            color: #f5f5f4;
            touch-action: manipulation;
        }

        .serif {
            font-family: 'Marcellus', serif;
        }

        #video-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #000;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: .45;
            }
        }

    </style>

</head>


<body class="min-h-screen">


<!-- =========================
     JITSI
========================= -->

<div id="video-container"></div>


<!-- =========================
     WAITING UI
========================= -->

<div id="main-ui" class="min-h-screen flex flex-col">


    <!-- HEADER -->

    <header
        class="flex items-center justify-between p-4 bg-stone-900 border-b border-stone-800"
    >

        <div class="flex items-center gap-2">

            <span class="text-xl">
                🎹
            </span>

            <span class="serif text-sm sm:text-base text-amber-100">
                PIANO BANSOU
            </span>

        </div>


        <a
            href="mypage.html"
            class="text-xs text-stone-400 border border-stone-700 px-3 py-2 rounded-lg"
        >
            戻る
        </a>

    </header>



    <!-- MAIN -->

    <main
        class="flex-1 flex items-center justify-center p-5"
    >

        <div
            class="w-full max-w-md bg-stone-800 rounded-3xl border border-stone-700 shadow-2xl overflow-hidden"
        >


            <!-- TOP -->

            <div class="h-1 bg-amber-500"></div>


            <div class="p-7 sm:p-9 text-center">


                <!-- ICON -->

                <div
                    class="w-20 h-20 mx-auto rounded-full bg-amber-500/10 flex items-center justify-center text-4xl"
                >
                    🎹
                </div>


                <!-- TITLE -->

                <h1
                    class="mt-7 text-2xl font-bold text-white"
                >
                    先生を待っています
                </h1>


                <p
                    class="mt-4 text-sm text-stone-400 leading-7"
                >
                    もうすぐ練習の時間です。<br>
                    先生が入室したら、ここから一緒に練習を始めます。
                </p>


                <!-- STATUS -->

                <div
                    class="mt-7 p-5 rounded-2xl bg-stone-900 border border-stone-700"
                >

                    <div class="flex items-center justify-center gap-3">

                        <span
                            id="status-dot"
                            class="w-3 h-3 rounded-full bg-amber-400 pulse"
                        ></span>

                        <span
                            id="status-text"
                            class="text-sm font-bold text-amber-300"
                        >
                            先生が入室するのを待っています
                        </span>

                    </div>


                    <p
                        id="status-detail"
                        class="mt-3 text-xs text-stone-500 leading-6"
                    >
                        この画面を開いたままお待ちください。
                    </p>

                </div>



                <!-- ENTER BUTTON -->

                <div id="join-area" class="hidden mt-6">

                    <button
                        id="join-button"
                        onclick="joinRoom()"
                        class="w-full bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold py-4 rounded-2xl shadow-lg transition active:scale-95"
                    >
                        🎹 先生と一緒に練習する
                    </button>

                </div>



                <!-- NOTICE -->

                <div
                    class="mt-7 text-left bg-stone-900/70 rounded-2xl p-4 border border-stone-700"
                >

                    <p
                        class="text-xs font-bold text-stone-300"
                    >
                        💡 準備しておこう
                    </p>

                    <ul
                        class="mt-3 space-y-2 text-xs text-stone-500 leading-6"
                    >

                        <li>
                            ・ピアノの前で待っていよう
                        </li>

                        <li>
                            ・楽譜を用意しておこう
                        </li>

                        <li>
                            ・マイクとカメラを使えるようにしておこう
                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer
        class="text-center py-4 text-xs text-stone-600 border-t border-stone-900"
    >

        &copy; PIANO BANSOU

    </footer>

</div>



<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    'https://flzguqgdgltwzuxudolg.supabase.co';


const SUPABASE_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   STATE
========================================= */

let currentUser = null;

let currentSession = null;

let jitsiApi = null;


/*
 * セッション確認間隔
 *
 * 本番ではRealtimeに変更します。
 * 今は10秒ごとにSupabaseを確認します。
 */

const CHECK_INTERVAL = 10000;



/* =========================================
   USER
========================================= */

async function loadUser() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href = 'login.html';

        return false;

    }


    currentUser = session.user;

    return true;

}



/* =========================================
   CHECK TUTOR
========================================= */

async function checkTutorPresence() {

    if (!currentUser) {
        return;
    }


    /*
     * tutorがactiveにした練習セッションを取得。
     *
     * practice_sessionsテーブルは
     * 次の工程で作成します。
     */

    const {
        data,
        error
    } = await supabaseClient
        .from('practice_sessions')
        .select('*')
        .eq('child_id', currentUser.id)
        .eq('status', 'active')
        .order('created_at', {
            ascending: false
        })
        .limit(1)
        .maybeSingle();


    if (error) {

        console.log(
            'セッション確認中:',
            error.message
        );

        /*
         * テーブルがまだない段階でも、
         * 子どもをJitsiへ入れない。
         */

        setWaiting();

        return;

    }


    if (!data) {

        setWaiting();

        return;

    }


    /*
     * tutorがactiveにした
     */

    currentSession = data;

    setTutorReady();

}



/* =========================================
   WAITING
========================================= */

function setWaiting() {

    const dot =
        document.getElementById('status-dot');

    const text =
        document.getElementById('status-text');

    const detail =
        document.getElementById('status-detail');

    const joinArea =
        document.getElementById('join-area');


    dot.className =
        'w-3 h-3 rounded-full bg-amber-400 pulse';


    text.innerText =
        '先生が入室するのを待っています';


    text.className =
        'text-sm font-bold text-amber-300';


    detail.innerText =
        '先生が入室したら、ここから一緒に練習を始めます。';


    joinArea.classList.add('hidden');

}



/* =========================================
   TUTOR READY
========================================= */

function setTutorReady() {

    const dot =
        document.getElementById('status-dot');

    const text =
        document.getElementById('status-text');

    const detail =
        document.getElementById('status-detail');

    const joinArea =
        document.getElementById('join-area');


    dot.className =
        'w-3 h-3 rounded-full bg-green-400';


    text.innerText =
        '先生が待っています！';


    text.className =
        'text-sm font-bold text-green-300';


    detail.innerText =
        '準備ができたら、ボタンを押して一緒に練習を始めよう。';


    joinArea.classList.remove('hidden');

}



/* =========================================
   JOIN ROOM
========================================= */

function joinRoom() {

    if (!currentSession) {

        alert(
            '先生がまだ入室していません。少し待ってみてください。'
        );

        return;

    }


    const roomName =
        currentSession.room_name;


    if (!roomName) {

        alert(
            '練習ルームの準備ができていません。'
        );

        return;

    }


    const container =
        document.getElementById('video-container');


    container.style.display =
        'block';


    document.getElementById('main-ui').style.display =
        'none';


    const displayName =
        currentUser.email
            ? currentUser.email.split('@')[0]
            : 'お子さま';


    const options = {

        roomName: roomName,

        width: '100%',

        height: '100%',

        parentNode: container,

        userInfo: {

            displayName: displayName

        },

        configOverwrite: {

            disableDeepLinking: true,

            startWithAudioMuted: false,

            startWithVideoMuted: false

        },

        interfaceConfigOverwrite: {

            SHOW_JITSI_WATERMARK: false,

            MOBILE_APP_PROMO: false

        }

    };


    jitsiApi =
        new JitsiMeetExternalAPI(
            'meet.jit.si',
            options
        );


    jitsiApi.addEventListener(
        'videoConferenceLeft',
        () => {

            container.style.display =
                'none';

            container.innerHTML =
                '';

            window.location.href =
                'mypage.html';

        }
    );

}



/* =========================================
   START
========================================= */

async function start() {

    const loggedIn =
        await loadUser();


    if (!loggedIn) {
        return;
    }


    await checkTutorPresence();


    /*
     * 10秒ごとに先生の入室状態を確認
     */

    setInterval(
        checkTutorPresence,
        CHECK_INTERVAL
    );

}


start();

</script>


</body>

</html>

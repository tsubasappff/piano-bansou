<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一緒に練習する｜ピアノ伴奏</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f8f7f4;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      line-height: 1.5;
    }

    .message {
      color: #666;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .status {
      background: #f5f3ef;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 15px;
      line-height: 1.7;
    }

    .status strong {
      display: block;
      font-size: 17px;
      margin-bottom: 4px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button:disabled {
      background: #ccc;
      cursor: default;
    }

    .error {
      color: #b00020;
      background: #fff0f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
    }

    .teacher {
      margin-top: 24px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="mypage.html" class="back">← マイページに戻る</a>

    <div class="card">

      <div class="icon">🎹</div>

      <h1 id="title">先生を待っています</h1>

      <div class="message" id="message">
        先生が準備できるまで、ここで待っていてね。
      </div>

      <div class="status" id="status">
        <strong>⏳ 準備中</strong>
        先生が練習を始めると、ここから参加できます。
      </div>

      <button id="joinButton" disabled>
        先生を待っています…
      </button>

      <div class="error" id="error"></div>

      <div class="teacher" id="teacherInfo">
        先生との練習ルーム
      </div>

    </div>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://flzguqgdgltwzuxudolg.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_OLBwcfhlNWH138L_olLRgw_je0YDJqn";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    let currentUser = null;
    let currentSession = null;

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const status = document.getElementById("status");
    const joinButton = document.getElementById("joinButton");
    const errorBox = document.getElementById("error");
    const teacherInfo = document.getElementById("teacherInfo");


    function showError(text) {
      errorBox.textContent = text;
      errorBox.style.display = "block";
    }


    function clearError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }


    async function loadSession() {

      clearError();

      const {
        data: {
          user
        },
        error: authError
      } = await supabaseClient.auth.getUser();


      if (authError || !user) {

        window.location.href = "login.html";
        return;
      }


      currentUser = user;


      /*
       * ① 生徒に割り当てられた先生を取得
       */

      const {
        data: assignment,
        error: assignmentError
      } = await supabaseClient
        .from("tutor_child_assignments")
        .select("tutor_id")
        .eq("child_id", currentUser.id)
        .maybeSingle();


      if (assignmentError) {

        console.error(assignmentError);

        showError(
          "先生との紐付けを確認できませんでした。"
        );

        return;
      }


      if (!assignment) {

        title.textContent = "先生の準備中です";

        message.textContent =
          "まだ担当の先生が設定されていません。";

        status.innerHTML = `
          <strong>🎹 もう少し待ってね</strong>
          先生との準備ができると、ここから練習できます。
        `;

        joinButton.disabled = true;
        joinButton.textContent = "先生を待っています…";

        return;
      }


      const tutorId = assignment.tutor_id;


      /*
       * ② その先生が、この生徒のために
       *    開始しているセッションを取得
       */

      const {
        data: session,
        error: sessionError
      } = await supabaseClient
        .from("practice_sessions")
        .select("*")
        .eq("child_id", currentUser.id)
        .eq("tutor_id", tutorId)
        .eq("status", "active")
        .order("created_at", {
          ascending: false
        })
        .limit(1)
        .maybeSingle();


      if (sessionError) {

        console.error(sessionError);

        showError(
          "練習ルームの状態を確認できませんでした。"
        );

        return;
      }


      /*
       * ③ まだ先生が開始していない
       */

      if (!session) {

        currentSession = null;

        title.textContent = "先生を待っています";

        message.textContent =
          "先生が準備できるまで、ここで待っていてね。";

        status.innerHTML = `
          <strong>⏳ 準備中</strong>
          先生が練習を始めると、ここから参加できます。
        `;

        joinButton.disabled = true;
        joinButton.textContent = "先生を待っています…";

        return;
      }


      /*
       * ④ 先生が開始した
       */

      currentSession = session;

      title.textContent = "先生と練習できます！";

      message.textContent =
        "先生が待っているよ。準備ができたら入ろう！";

      status.innerHTML = `
        <strong>🎹 準備OK！</strong>
        先生と一緒に練習を始めよう。
      `;

      joinButton.disabled = false;
      joinButton.textContent = "🎹 一緒に練習する";

      teacherInfo.textContent =
        "担当の先生との1対1練習";

    }


    /*
     * Dailyへ参加
     */

    joinButton.addEventListener(
      "click",
      async function() {

        if (!currentSession) {
          return;
        }

        if (!currentSession.room_name) {

          showError(
            "練習ルームがまだ準備されていません。"
          );

          return;
        }


        /*
         * 現段階ではDaily Prebuiltを
         * ルームURLで開く。
         *
         * 後ほど生徒専用の短期トークン方式に変更する。
         */

        const roomUrl =
          "https://piano-bansou.daily.co/" +
          currentSession.room_name;


        window.location.href = roomUrl;

      }
    );


    /*
     * 10秒ごとに先生の開始状態を確認
     */

    setInterval(
      loadSession,
      10000
    );


    /*
     * 初回読み込み
     */

    loadSession();

  </script>

</body>
</html>

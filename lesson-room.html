<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オンラインレッスン室 - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #1c1917;
            color: #f5f5f4;
            touch-action: manipulation;
        }
        .serif-title {
            font-family: 'Marcellus', serif;
        }
        /* 画面内埋め込み用フレームのスタイル */
        #zoom-frame-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background-color: #000;
        }
        #zoom-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 埋め込み表示エリア -->
    <div id="zoom-frame-container">
        <div class="absolute top-3 right-3 z-50">
            <button onclick="closeZoomFrame()" class="bg-stone-800/80 text-white text-xs px-3 py-1.5 rounded-lg border border-stone-600 hover:bg-stone-700">
                ✕ 退出してマイページへ
            </button>
        </div>
        <iframe id="zoom-iframe" allow="camera; microphone; display-capture"></iframe>
    </div>

    <!-- 通常の画面表示エリア -->
    <div id="main-ui" class="min-h-screen flex flex-col justify-between">
        
        <!-- ヘッダー -->
        <header class="flex items-center justify-between p-4 bg-stone-900/90 backdrop-blur-sm border-b border-stone-800">
            <div class="flex items-center gap-2">
                <span class="text-xl">🎹</span>
                <span class="font-medium text-amber-100 serif-title text-sm sm:text-base">オンラインレッスン室</span>
            </div>
            <a href="mypage.html" class="text-xs text-stone-400 hover:text-white px-3 py-1.5 rounded-lg border border-stone-700 hover:bg-stone-800 transition">
                マイページへ戻る
            </a>
        </header>

        <!-- メインエリア -->
        <main class="flex-1 flex flex-col items-center justify-center p-4">

            <div class="text-center space-y-6 max-w-md w-full p-6 sm:p-8 bg-stone-800/90 rounded-3xl border border-stone-700 shadow-2xl relative overflow-hidden">
                
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-600 via-amber-400 to-amber-600"></div>

                <div class="w-14 h-14 sm:w-16 sm:h-16 bg-blue-500/10 text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-2xl sm:text-3xl">
                    📹
                </div>

                <div class="space-y-2">
                    <h2 class="text-lg sm:text-xl font-bold text-stone-100 tracking-wide">オンラインレッスン</h2>
                    <p class="text-xs text-stone-400 leading-relaxed">
                        Zoomログイン不要でそのまま接続します。<br>時間になりましたら下のボタンを押してください。
                    </p>
                </div>

                <!-- Zoom 埋め込みスタートボタン -->
                <button onclick="startZoomLesson()" 
                    class="inline-flex items-center justify-center gap-2 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 sm:py-4 rounded-xl transition shadow-lg shadow-blue-900/50 text-sm">
                    <span>レッスンに参加する</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>

                <!-- 入室前の確認事項 -->
                <div class="text-left space-y-3 bg-stone-900/80 p-4 rounded-xl border border-stone-700/50 text-xs">
                    <h3 class="font-bold text-amber-400 flex items-center gap-1">
                        💡 ご利用のご案内
                    </h3>
                    <ul class="text-stone-300 space-y-2 text-[11px] leading-relaxed">
                        <li class="flex gap-2">
                            <span class="text-stone-500">•</span>
                            <span>カメラやマイクの許可ダイアログが出た場合は「許可」を選択してください。</span>
                        </li>
                        <li class="flex gap-2">
                            <span class="text-stone-500">•</span>
                            <span>講師が入室を許可するまで待機画面でお待ちください。</span>
                        </li>
                    </ul>
                </div>

            </div>

        </main>

        <!-- フッター -->
        <footer class="text-center py-3 text-xs text-stone-500 border-t border-stone-900">
            &copy; ピアノ練習伴走 Lab
        </footer>
    </div>

    <script>
        // 設定済みのZoomWeb直接参加URL
        const ZOOM_EMBED_URL = "https://zoom.us/wc/join/6538746410?pwd=U2HNw6";

        function startZoomLesson() {
            const container = document.getElementById('zoom-frame-container');
            const iframe = document.getElementById('zoom-iframe');
            
            // 埋め込みURLをセットして表示
            iframe.src = ZOOM_EMBED_URL;
            container.style.display = 'block';
        }

        function closeZoomFrame() {
            const container = document.getElementById('zoom-frame-container');
            const iframe = document.getElementById('zoom-iframe');
            
            iframe.src = "";
            container.style.display = 'none';
            window.location.href = "mypage.html";
        }
    </script>
</body>
</html>

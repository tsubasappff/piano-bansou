<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-200">
        <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">ログイン</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">メールアドレス</label>
                <input type="email" id="email" required placeholder="example@email.com" class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-bold text-slate-600">パスワード</label>
                    <!-- ★ここに「パスワードをお忘れの方」リンクが入っています -->
                    <a href="forgot-password.html" class="text-xs text-indigo-600 font-bold hover:underline">パスワードをお忘れの方</a>
                </div>
                <input type="password" id="password" required class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">
                ログイン
            </button>
        </form>

        <p class="text-xs text-center text-slate-500 mt-6">
            アカウントをお持ちでないですか？ <a href="signup.html" class="text-indigo-600 font-bold hover:underline">新規登録</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = 'ログイン中...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('ログインエラー: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'ログイン';
            } else {
                window.location.href = 'mypage.html';
            }
        });
    </script>
</body>
</html>

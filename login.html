<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            background-color: #1a1615;
            color: #f3efe6;
        }
        .serif-title {
            font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-stone-800 via-stone-900 to-black">

    <div class="max-w-md w-full bg-stone-900/90 backdrop-blur-md rounded-2xl p-6 sm:p-8 border border-amber-900/30 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="inline-block px-3 py-1 bg-amber-950/60 border border-amber-700/40 rounded-full text-amber-200/80 text-[11px] tracking-widest mb-1">
                ONLINE PIANO LESSON
            </div>
            <h1 class="text-2xl sm:text-3xl font-semibold text-amber-100 serif-title tracking-wide">
                🎹 ピアノ練習伴走 Lab
            </h1>
            <p class="text-stone-400 text-xs leading-relaxed">
                マイページへログインしてレッスンを開始します
            </p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div class="space-y-1.5">
                <label for="email" class="block text-xs font-medium text-stone-300 tracking-wider">メールアドレス</label>
                <input type="email" id="email" required placeholder="example@email.com"
                    class="w-full bg-stone-950/80 border border-stone-700/60 rounded-xl px-4 py-3 text-stone-200 text-sm focus:outline-none focus:border-amber-600 transition placeholder:text-stone-600">
            </div>

            <div class="space-y-1.5">
                <label for="password" class="block text-xs font-medium text-stone-300 tracking-wider">パスワード</label>
                <input type="password" id="password" required placeholder="パスワードを入力"
                    class="w-full bg-stone-950/80 border border-stone-700/60 rounded-xl px-4 py-3 text-stone-200 text-sm focus:outline-none focus:border-amber-600 transition placeholder:text-stone-600">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-gradient-to-r from-amber-700 to-amber-800 hover:from-amber-600 hover:to-amber-700 text-amber-50 font-medium py-3.5 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2 border border-amber-600/30">
                ログインして受講室へ
            </button>
        </form>

        <div class="text-center text-xs text-stone-400 border-t border-stone-800/80 pt-4">
            初めてご利用の方は 
            <a href="signup.html" class="text-amber-400 hover:text-amber-300 font-medium underline underline-offset-4">新規アカウント作成</a>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = 'ログイン中...';

                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    alert('ログインエラー: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'ログインして受講室へ';
                } else {
                    window.location.href = 'mypage.html';
                }
            } catch (err) {
                alert('システムエラーが発生しました: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'ログインして受講室へ';
            }
        }
    </script>
</body>
</html>

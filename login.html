<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fcfbf9;
            color: #4a423d;
        }
        .serif-title {
            font-family: 'Marcellus', serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-amber-50/60 via-stone-50 to-amber-100/30">

    <div class="max-w-md w-full bg-white/90 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-stone-200/80 shadow-xl shadow-stone-200/50 space-y-6">
        
        <!-- ヘッダーエリア -->
        <div class="text-center space-y-2">
            <div class="inline-block px-3.5 py-1 bg-amber-100/70 text-amber-900/80 rounded-full text-[11px] font-medium tracking-wider mb-1">
                MEMBER LOGIN
            </div>
            <h1 class="text-2xl sm:text-3xl font-normal text-stone-800 tracking-wide">
                ログイン
            </h1>
            <p class="text-stone-500 text-xs leading-relaxed">
                登録済みのメールアドレスとパスワードを入力してください。
            </p>
        </div>

        <!-- ログインフォーム -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div class="space-y-1.5">
                <label for="email" class="block text-xs font-bold text-stone-600">メールアドレス</label>
                <input type="email" id="email" required placeholder="example@email.com"
                    class="w-full bg-stone-50/80 border border-stone-200 rounded-xl px-4 py-3 text-stone-800 text-sm focus:outline-none focus:border-amber-400 focus:bg-white transition placeholder:text-stone-300">
            </div>

            <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-xs font-bold text-stone-600">パスワード</label>
                    <a href="forgot-password.html" class="text-xs text-amber-800 hover:underline font-medium">
                        パスワードをお忘れの方
                    </a>
                </div>
                <input type="password" id="password" required placeholder="••••••••"
                    class="w-full bg-stone-50/80 border border-stone-200 rounded-xl px-4 py-3 text-stone-800 text-sm focus:outline-none focus:border-amber-400 focus:bg-white transition placeholder:text-stone-300">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-stone-800 hover:bg-stone-700 text-amber-50 font-medium py-3.5 rounded-xl transition shadow-md text-sm flex items-center justify-center gap-2 pt-2">
                ログイン
            </button>
        </form>

        <!-- サインアップへの導線 -->
        <div class="text-center pt-2 border-t border-stone-100">
            <p class="text-xs text-stone-500">
                アカウントをお持ちでない方は 
                <a href="signup.html" class="text-amber-800 font-bold hover:underline">新規登録</a> 
                へ
            </p>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = 'ログイン中...';

                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    alert('ログインに失敗しました: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'ログイン';
                } else {
                    window.location.href = 'mypage.html';
                }
            } catch (err) {
                alert('システムエラーが発生しました: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'ログイン';
            }
        }
    </script>
</body>
</html>

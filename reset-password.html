<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>新しいパスワードを設定 - ピアノ練習伴走 Lab</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fcfbf9;
            color: #4a423d;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-amber-50/60 via-stone-50 to-amber-100/30">

    <div class="max-w-md w-full bg-white/90 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-stone-200/80 shadow-xl shadow-stone-200/50 space-y-6">

        <div class="text-center space-y-2">

            <div class="inline-block px-3.5 py-1 bg-amber-100/70 text-amber-900/80 rounded-full text-[11px] font-medium tracking-wider mb-1">
                PASSWORD RESET
            </div>

            <h1 class="text-2xl sm:text-3xl font-normal text-stone-800 tracking-wide">
                新しいパスワード
            </h1>

            <p class="text-stone-500 text-xs leading-relaxed">
                新しいパスワードを入力してください。
            </p>

        </div>


        <form id="passwordForm" onsubmit="handleUpdatePassword(event)" class="space-y-4">

            <div class="space-y-1.5">

                <label for="password"
                       class="block text-xs font-bold text-stone-600">
                    新しいパスワード
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    minlength="6"
                    placeholder="6文字以上"
                    class="w-full bg-stone-50/80 border border-stone-200 rounded-xl px-4 py-3 text-stone-800 text-sm focus:outline-none focus:border-amber-400 focus:bg-white transition placeholder:text-stone-300"
                >

            </div>


            <div class="space-y-1.5">

                <label for="passwordConfirm"
                       class="block text-xs font-bold text-stone-600">
                    新しいパスワード（確認）
                </label>

                <input
                    type="password"
                    id="passwordConfirm"
                    required
                    minlength="6"
                    placeholder="もう一度入力してください"
                    class="w-full bg-stone-50/80 border border-stone-200 rounded-xl px-4 py-3 text-stone-800 text-sm focus:outline-none focus:border-amber-400 focus:bg-white transition placeholder:text-stone-300"
                >

            </div>


            <button
                type="submit"
                id="submitBtn"
                class="w-full bg-stone-800 hover:bg-stone-700 text-amber-50 font-medium py-3.5 rounded-xl transition shadow-md text-sm"
            >
                パスワードを変更する
            </button>

        </form>


        <div
            id="message"
            class="hidden text-center text-sm leading-relaxed rounded-xl p-4"
        ></div>


        <div id="loginLink" class="hidden text-center">

            <a
                href="login.html"
                class="text-sm text-amber-800 font-bold hover:underline"
            >
                ログイン画面へ
            </a>

        </div>

    </div>


    <script>

        const SUPABASE_URL =
            'https://flzguqgdgltwzuxudolg.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_OLBwcfhlNWH138L_olLRgw_je0YDJqn';


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function handleUpdatePassword(event) {

            event.preventDefault();


            const password =
                document.getElementById('password').value;

            const passwordConfirm =
                document.getElementById('passwordConfirm').value;

            const submitBtn =
                document.getElementById('submitBtn');

            const message =
                document.getElementById('message');

            const loginLink =
                document.getElementById('loginLink');


            message.classList.add('hidden');


            if (password !== passwordConfirm) {

                message.textContent =
                    'パスワードが一致していません。';

                message.className =
                    'text-center text-sm leading-relaxed rounded-xl p-4 bg-red-50 text-red-700';

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    'パスワードは6文字以上にしてください。';

                message.className =
                    'text-center text-sm leading-relaxed rounded-xl p-4 bg-red-50 text-red-700';

                return;
            }


            submitBtn.disabled = true;
            submitBtn.innerText = '変更中...';


            try {

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });


                if (error) {

                    message.textContent =
                        'パスワードの変更に失敗しました。再設定メールのリンクをもう一度お試しください。';

                    message.className =
                        'text-center text-sm leading-relaxed rounded-xl p-4 bg-red-50 text-red-700';

                    submitBtn.disabled = false;
                    submitBtn.innerText = 'パスワードを変更する';

                    return;
                }


                message.textContent =
                    'パスワードを変更しました。ログイン画面からログインしてください。';

                message.className =
                    'text-center text-sm leading-relaxed rounded-xl p-4 bg-green-50 text-green-700';


                submitBtn.innerText = '変更しました';

                loginLink.classList.remove('hidden');


                await supabaseClient.auth.signOut();


            } catch (err) {

                message.textContent =
                    'システムエラーが発生しました。もう一度お試しください。';

                message.className =
                    'text-center text-sm leading-relaxed rounded-xl p-4 bg-red-50 text-red-700';

                submitBtn.disabled = false;
                submitBtn.innerText = 'パスワードを変更する';

            }

        }

    </script>

</body>
</html>

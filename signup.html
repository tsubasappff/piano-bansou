<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規ご入会・アカウント登録 - ピアノ練習伴走 Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fcfbf9;
            color: #4a423d;
        }
        .french-title {
            font-family: 'Marcellus', serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-amber-50/60 via-stone-50 to-amber-100/30">

    <div class="max-w-md w-full bg-white/90 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-stone-200/80 shadow-xl shadow-stone-200/50 space-y-6 relative">
        
        <!-- トップページへ戻るボタン -->
        <div class="flex items-center justify-start">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-stone-500 hover:text-amber-800 transition font-medium py-1 px-2.5 rounded-full hover:bg-amber-50/80">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                最初のページに戻る
            </a>
        </div>

        <!-- ヘッダーエリア -->
        <div class="text-center space-y-2">
            <div class="inline-block px-3.5 py-1 bg-amber-100/70 text-amber-900/80 rounded-full text-[11px] font-medium tracking-wider mb-1">
                PARISIAN PIANO SALON
            </div>
            <h1 class="text-2xl sm:text-3xl font-normal text-stone-800 french-title tracking-wide">
                🎹 ピアノ練習伴走 Lab
            </h1>
            <p class="text-stone-500 text-xs leading-relaxed">
                光あふれるカフェのような空間で、やさしく寄り添うオンラインレッスン
            </p>
        </div>

        <!-- 登録フォーム -->
        <form id="signupForm" onsubmit="handleSignUp(event)" class="space-y-4">
            
            <!-- メールアドレス入力 -->
            <div class="space-y-1.5">
                <label for="email" class="block text-xs font-bold text-stone-600">メールアドレス</label>
                <input type="email" id="email" required placeholder="example@email.com" oninput="validateInput()"
                    class="w-full bg-stone-50/80 border border-stone-200 rounded-xl px-4 py-3 text-stone-800 text-sm focus:outline-none focus:border-amber-400 focus:bg-white transition placeholder:text-stone-300">
            </div>

            <!-- パスワード入力 -->
            <div class="space-y-1.5">
                <label for="password" class="block text-xs font-bold text-stone-600">パスワード</label>
                <input type="password" id="password" required placeholder="半角6文字以上" oninput="validateInput()"
                    class="w-full bg-stone-50/80 border border-stone-200 rounded-xl px-4 py-3 text-stone-800 text-sm focus:outline-none focus:border-amber-400 focus:bg-white transition placeholder:text-stone-300">
                
                <!-- リアルタイム文字数判定 -->
                <div id="passwordHint" class="text-xs text-stone-400 font-medium flex items-center gap-1 pt-1">
                    <span>半角6文字以上でご入力ください</span>
                </div>
            </div>

            <!-- 登録ボタン -->
            <button type="submit" id="submitBtn" disabled
                class="w-full bg-stone-800 hover:bg-stone-700 disabled:bg-stone-200 disabled:text-stone-400 disabled:cursor-not-allowed text-amber-50 font-medium py-3.5 rounded-xl transition shadow-md text-sm flex items-center justify-center gap-2">
                はじめる（アカウント作成）
            </button>
        </form>

        <!-- 保護者の方への安心カード -->
        <div class="bg-amber-50/50 p-3.5 rounded-2xl border border-amber-100 text-[11px] text-stone-600 space-y-1">
            <p class="flex items-center gap-1.5 text-amber-900 font-bold">
                ☕️ 保護者様も安心のレッスン環境
            </p>
            <p class="text-stone-500 leading-snug">
                安全に管理されたワンタップ入室機能で、お子様一人でも迷わずレッスンを始められます。
            </p>
        </div>

        <!-- ログインリンク -->
        <div class="text-center text-xs text-stone-400 border-t border-stone-100 pt-4">
            すでにアカウントをお持ちですか？ 
            <a href="login.html" class="text-amber-700 hover:text-amber-800 font-bold underline underline-offset-4">ログインはこちら</a>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://flzguqgdgltwzuxudolg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemd1cWdkZ2x0d3p1eHVkb2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE3NzcsImV4cCI6MjEwMzg0Nzc3N30.uD9R7Q6QbtWJ0bkZ-KHZF2D06vJV4g_mMn74IISjqQY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function validateInput() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordHint = document.getElementById('passwordHint');
            const submitBtn = document.getElementById('submitBtn');

            const isEmailValid = email.length > 0 && email.includes('@');
            const isPasswordValid = password.length >= 6;

            if (password.length === 0) {
                passwordHint.className = "text-xs text-stone-400 font-medium flex items-center gap-1 pt-1";
                passwordHint.innerHTML = "<span>半角6文字以上でご入力ください</span>";
            } else if (isPasswordValid) {
                passwordHint.className = "text-xs text-emerald-600 font-medium flex items-center gap-1 pt-1";
                passwordHint.innerHTML = "<span>✅ 6文字以上入力されています</span>";
            } else {
                passwordHint.className = "text-xs text-rose-500 font-medium flex items-center gap-1 pt-1";
                passwordHint.innerHTML = `<span>あと ${6 - password.length} 文字必要です</span>`;
            }

            if (isEmailValid && isPasswordValid) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        async function handleSignUp(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = '登録処理中...';

                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                });

                if (error) {
                    alert('登録エラー: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'はじめる（アカウント作成）';
                } else {
                    alert('アカウント作成が完了しました！ログイン画面へ移動します。');
                    window.location.href = 'login.html';
                }
            } catch (err) {
                alert('システムエラーが発生しました: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'はじめる（アカウント作成）';
            }
        }
    </script>
</body>
</html>
